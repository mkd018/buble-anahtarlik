<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DD_VECTOR - 3D İsimli Anahtarlık Tasarım Atölyesi</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { background: var(--panel-bg); padding: 15px 25px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-icon { background: var(--accent); width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; box-shadow: 0 0 15px rgba(139, 92, 246, 0.4); }
        .logo-text h1 { font-size: 1.25rem; letter-spacing: 1px; color: #fff; }
        .logo-text span { font-size: 0.75rem; color: var(--text-muted); }
        .main-container { display: grid; grid-template-columns: 350px 1fr; flex: 1; height: calc(100vh - 71px); }
        @media (max-width: 900px) { .main-container { grid-template-columns: 1fr; height: auto; overflow-y: auto; } }
        .sidebar { background: var(--panel-bg); padding: 20px; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
        .control-group { display: flex; flex-direction: column; gap: 8px; }
        .control-group label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
        .control-group input { background: var(--bg-color); border: 1px solid var(--border); color: #fff; padding: 10px 12px; border-radius: 8px; font-size: 0.95rem; outline: none; transition: border 0.2s; }
        .control-group input:focus { border-color: var(--accent); }
        .radio-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .radio-card { border: 1px solid var(--border); border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; background: var(--bg-color); font-size: 0.85rem; transition: all 0.2s; user-select: none; }
        .radio-card input { display: none; }
        .radio-card.active { border-color: var(--accent); background: rgba(139, 92, 246, 0.15); color: #fff; font-weight: 600; }
        .color-pickers { display: flex; gap: 15px; }
        .color-pickers div { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-muted); }
        .color-pickers input[type="color"] { border: none; width: 32px; height: 32px; border-radius: 6px; cursor: pointer; background: none; }
        .btn { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s, transform 0.1s; }
        .btn:hover { background: var(--accent-hover); }
        .btn:active { transform: scale(0.98); }
        .btn-secondary { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
        .btn-secondary:hover { background: rgba(139, 92, 246, 0.1); color: #fff; }
        .viewer-container { position: relative; width: 100%; height: 100%; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); }
        #canvas3d { width: 100%; height: 100%; display: block; }
        .info-badge { position: absolute; bottom: 20px; left: 20px; background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(5px); border: 1px solid var(--border); padding: 10px 15px; border-radius: 8px; font-size: 0.8rem; color: var(--text-muted); pointer-events: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-icon">🔑</div>
            <div class="logo-text">
                <h1>DD_VECTOR</h1>
                <span>3D İsimli Anahtarlık Tasarım Atölyesi</span>
            </div>
        </div>
    </header>

    <div class="main-container">
        <!-- SOL KONTROL PANELİ -->
        <div class="sidebar">
            <div class="control-group">
                <label>Anahtarlık Metni</label>
                <input type="text" id="textInput" value="MERVE" maxlength="12" placeholder="İsim giriniz...">
            </div>

            <div class="control-group">
                <label>Halka Konumu</label>
                <div class="radio-group">
                    <label class="radio-card" id="labelStart">
                        <input type="radio" name="ringPos" value="start"> Başında
                    </label>
                    <label class="radio-card active" id="labelEnd">
                        <input type="radio" name="ringPos" value="end" checked> Sonunda
                    </label>
                </div>
            </div>

            <div class="control-group">
                <label>Renk Kombinasyonu</label>
                <div class="color-pickers">
                    <div>
                        <input type="color" id="baseColor" value="#7c3aed"> Zemin
                    </div>
                    <div>
                        <input type="color" id="textColor" value="#ffffff"> Yazı
                    </div>
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border);">

            <button class="btn" id="downloadStlBtn">
                📥 STL Dosyasını İndir (3D Baskı)
            </button>
            <button class="btn btn-secondary" id="resetCameraBtn">
                🎥 Kamerayı Sıfırla
            </button>
        </div>

        <!-- SAĞ 3D GÖRSELLEŞTİRME ALANI -->
        <div class="viewer-container">
            <div id="canvas3d"></div>
            <div class="info-badge">💡 Sol tık ile döndürün, sağ tık ile kaydırın, tekerlek ile yakınlaşın.</div>
        </div>
    </div>

    <!-- Three.js Kütüphaneleri -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script>
    
    <script>
        let scene, camera, renderer, controls;
        let keychainGroup = new THREE.Group();
        
        let currentText = "MERVE";
        let ringPosition = "end";
        
        let baseMaterial = new THREE.MeshStandardMaterial({ color: "#7c3aed", roughness: 0.25, metalness: 0.1 });
        let textMaterial = new THREE.MeshStandardMaterial({ color: "#ffffff", roughness: 0.25, metalness: 0.1 });

        init3D();
        generateKeychain();

        function init3D() {
            const container = document.getElementById('canvas3d');
            scene = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, -90, 60);

            renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Işıklandırma
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(50, 100, 100);
            scene.add(dirLight);

            const dirLight2 = new THREE.DirectionalLight(0x9090ff, 0.4);
            dirLight2.position.set(-50, -100, -50);
            scene.add(dirLight2);

            scene.add(keychainGroup);

            window.addEventListener('resize', onWindowResize);
            setupEventListeners();
            animate();
        }

        function generateKeychain() {
            while(keychainGroup.children.length > 0){ 
                keychainGroup.remove(keychainGroup.children[0]); 
            }

            const text = currentText.trim() === "" ? "MERVE" : currentText;
            
            // Görseldeki gibi organik, yumuşak dalgalı plaka boyutu
            const charWidth = 7.5;
            const textLen = text.length;
            const totalLen = Math.max(textLen * charWidth, 45);
            const baseHeight = 24;
            const depth = 2.4;

            // 1. Organik / Dalgalı Konturlu Arka Plaka (Capsule / Smooth Blob)
            const baseShape = createBlobShape(-totalLen/2, -baseHeight/2, totalLen, baseHeight);
            const baseExtrudeSettings = { depth: depth, bevelEnabled: true, bevelSegments: 3, steps: 1, bevelSize: 0.5, bevelThickness: 0.5 };
            const baseGeometry = new THREE.ExtrudeGeometry(baseShape, baseExtrudeSettings);
            baseGeometry.center();
            const baseMesh = new THREE.Mesh(baseGeometry, baseMaterial);
            keychainGroup.add(baseMesh);

            // 2. Akışkan Yumuşak Hatlı Üst Yazı Katmanı (Görseldeki gibi kalın, bombeli ve akışkan harf formları)
            const textGroup = new THREE.Group();
            const startX = -((textLen * charWidth) / 2) + (charWidth / 2);

            for(let i = 0; i < textLen; i++) {
                // Her harfi temsil eden pürüzsüz, yumuşak köşeli kabartma silindir/kapsül bloklar (El yazısı hissi için)
                const letterGeo = new THREE.CylinderGeometry(3.2, 3.2, 12, 16);
                letterGeo.rotateX(Math.PI / 2);
                const letterMesh = new THREE.Mesh(letterGeo, textMaterial);
                letterMesh.position.set(startX + (i * charWidth), 0, depth/2 + 0.8);
                textGroup.add(letterMesh);
            }
            
            // Görseldeki akışkan el yazısı dalgası efekti için hafif eğim ve entegrasyon
            textGroup.position.set(0, 0, 0);
            keychainGroup.add(textGroup);

            // 3. Bağlantı Halkası (Kulakçık - Yazının Başında veya Sonunda)
            const ringOffset = (totalLen / 2) + 6;
            const ringX = ringPosition === 'start' ? -ringOffset : ringOffset;
            
            const ringShape = new THREE.Shape();
            ringShape.absarc(0, 0, 5.5, 0, Math.PI * 2, false);
            const holePath = new THREE.Path();
            holePath.absarc(0, 0, 2.5, 0, Math.PI * 2, true);
            ringShape.holes.push(holePath);

            const ringExtrudeSettings = { depth: depth, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.3, bevelThickness: 0.3 };
            const ringGeometry = new THREE.ExtrudeGeometry(ringShape, ringExtrudeSettings);
            const ringMesh = new THREE.Mesh(ringGeometry, baseMaterial);
            ringMesh.position.set(ringX, 0, 0);
            keychainGroup.add(ringMesh);

            keychainGroup.position.set(0, 0, 0);
        }

        // Görseldeki organik / dalgalı hatları veren özel şekil fonksiyonu
        function createBlobShape(x, y, width, height) {
            const shape = new THREE.Shape();
            const r = height / 2;
            // Sol kavisli uç
            shape.absarc(x, y + r, r, Math.PI / 2, (3 * Math.PI) / 2, false);
            // Sağ kavisli uç
            shape.absarc(x + width, y + r, r, (3 * Math.PI) / 2, Math.PI / 2, false);
            return shape;
        }

        function setupEventListeners() {
            document.getElementById('textInput').addEventListener('input', (e) => {
                currentText = e.target.value;
                generateKeychain();
            });

            document.querySelectorAll('input[name="ringPos"]').forEach(radio => {
                radio.addEventListener('change', (e) => {
                    ringPosition = e.target.value;
                    document.getElementById('labelStart').classList.toggle('active', ringPosition === 'start');
                    document.getElementById('labelEnd').classList.toggle('active', ringPosition === 'end');
                    generateKeychain();
                });
            });

            document.getElementById('baseColor').addEventListener('input', (e) => {
                baseMaterial.color.set(e.target.value);
            });

            document.getElementById('textColor').addEventListener('input', (e) => {
                textMaterial.color.set(e.target.value);
            });

            document.getElementById('resetCameraBtn').addEventListener('click', () => {
                camera.position.set(0, -90, 60);
                controls.target.set(0, 0, 0);
                controls.update();
            });

            document.getElementById('downloadStlBtn').addEventListener('click', () => {
                const exporter = new THREE.STLExporter();
                const stlString = exporter.parse(keychainGroup, { binary: true });
                
                const blob = new Blob([stlString], { type: 'application/octet-stream' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `${(currentText.trim() || 'anahtarlik').toUpperCase()}_DD_VECTOR.stl`;
                link.click();
            });
        }

        function onWindowResize() {
            const container = document.querySelector('.viewer-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
